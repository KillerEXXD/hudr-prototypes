<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUDR Scout v2.0 — AI Poker Intelligence</title>
    <style>
        /* =============================================
           HUDR Prototype O — "The Scout" v2.0
           Light Theme + AI Deterministic Engine
           FotMob + DraftKings + The Athletic inspired
           ============================================= */

        /* ===================== Reset & Variables ===================== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-page: #f0f2f5;
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fb;
            --bg-tertiary: #f1f3f6;
            --bg-card: #ffffff;
            --bg-surface: #fafbfc;
            --border-light: #e5e7eb;
            --border-medium: #d1d5db;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent-orange: #ea580c;
            --accent-orange-light: #fb923c;
            --accent-blue: #2563eb;
            --accent-emerald: #059669;
            --accent-red: #dc2626;
            --accent-amber: #d97706;
            --accent-purple: #7c3aed;
            --accent-gold: #ca8a04;
            --shadow-card: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-elevated: 0 4px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06);
            --shadow-glow-orange: 0 0 0 3px rgba(234,88,12,0.12);
            --radius: 14px;
            --radius-sm: 10px;
            --radius-full: 9999px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
            overflow-y: auto;
        }

        /* ===================== Phone Frame ===================== */
        .phone-frame {
            width: 390px;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg-secondary);
            position: relative;
            overflow-x: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.08);
            padding-bottom: 80px;
        }

        @media (max-width: 430px) {
            .phone-frame { width: 100%; box-shadow: none; }
        }

        /* ===================== Top Bar ===================== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-light);
        }

        .logo {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, #ea580c, #f97316);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            color: #fff;
            cursor: pointer;
        }

        .top-bar-title {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 2px;
            color: var(--accent-orange);
        }

        .top-bar-version {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-muted);
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: var(--radius-full);
            margin-left: 6px;
        }

        .search-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-muted);
            transition: all 0.15s;
        }

        .search-btn:hover { border-color: var(--accent-orange); color: var(--accent-orange); }

        /* ===================== Bottom Tab Bar ===================== */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 390px;
            z-index: 100;
            display: flex;
            background: rgba(255,255,255,0.96);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-light);
            padding: 6px 0 env(safe-area-inset-bottom, 8px);
            box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
        }

        @media (max-width: 430px) {
            .tab-bar { width: 100%; left: 0; transform: none; }
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 0;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            transition: color 0.15s;
        }

        .tab-item.active { color: var(--accent-orange); }
        .tab-item .tab-icon { font-size: 20px; }

        /* ===================== Content Layout ===================== */
        .content { padding: 0 16px; }
        .screen-hidden { display: none; }

        /* ===================== Hero Card ===================== */
        .hero-card {
            border-radius: var(--radius);
            padding: 22px;
            position: relative;
            overflow: hidden;
            color: #fff;
            margin-bottom: 20px;
            cursor: pointer;
            transition: transform 0.15s;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            box-shadow: var(--shadow-elevated);
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-gold));
        }

        .hero-card:hover { transform: scale(1.01); }

        .hero-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.8;
        }

        .hero-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 4px 0;
        }

        .hero-sub {
            font-size: 13px;
            opacity: 0.75;
        }

        .kpi-row {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .kpi-pill {
            padding: 4px 12px;
            border-radius: var(--radius-full);
            background: rgba(255,255,255,0.15);
            font-size: 12px;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }

        /* ===================== Section ===================== */
        .section {
            margin-bottom: 24px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 0 16px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }

        .section-link {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-orange);
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
        }

        /* ===================== Horizontal Scroll ===================== */
        .h-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            padding: 0 16px 4px;
            margin: 0;
            scrollbar-width: none;
        }

        .h-scroll::-webkit-scrollbar { display: none; }
        .h-scroll > * { scroll-snap-align: start; flex-shrink: 0; }

        /* ===================== Mini Tournament Card ===================== */
        .mini-card {
            width: 180px;
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
            box-shadow: var(--shadow-card);
        }

        .mini-card:hover { transform: scale(1.03); border-color: var(--accent-orange); }

        .mini-gradient { height: 5px; background: linear-gradient(90deg, var(--accent-orange), var(--accent-gold)); }

        .mini-body { padding: 12px; }

        .mini-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .mini-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .mini-badges {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .mini-badge {
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 700;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: var(--radius-full);
            background: var(--accent-red);
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        /* ===================== Player Avatar ===================== */
        .player-avatar {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
        }

        .avatar-lg { width: 64px; height: 64px; font-size: 24px; }
        .avatar-md { width: 48px; height: 48px; font-size: 18px; }
        .avatar-sm { width: 36px; height: 36px; font-size: 14px; }

        /* ===================== Player Mini (horizontal grid) ===================== */
        .player-mini {
            width: 80px;
            text-align: center;
            cursor: pointer;
        }

        .player-mini .player-avatar { margin: 0 auto 6px; }

        .player-mini-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .player-mini-stat {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ===================== Luck Score Gauge ===================== */
        .luck-card {
            width: 120px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 12px;
            text-align: center;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            transition: transform 0.15s;
        }

        .luck-card:hover { transform: scale(1.03); }

        .luck-name {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 6px;
        }

        .luck-value {
            font-size: 12px;
            font-weight: 700;
        }

        /* ===================== Insight Card ===================== */
        .insight-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 14px 16px;
            display: flex;
            gap: 12px;
            cursor: pointer;
            margin-bottom: 8px;
            box-shadow: var(--shadow-card);
            transition: border-color 0.15s;
            position: relative;
            overflow: hidden;
        }

        .insight-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--accent-orange);
        }

        .insight-card:hover { border-color: var(--accent-orange); }

        /* ===================== Moment Card ===================== */
        .moment-card {
            width: 240px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s;
            box-shadow: var(--shadow-card);
        }

        .moment-card:hover { transform: scale(1.03); }
        .moment-accent { height: 4px; }

        .moment-body { padding: 12px; }

        .moment-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .moment-type {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .moment-text {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .moment-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .moment-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }

        /* ===================== Hand Strength Tier Badge ===================== */
        .tier-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #fff;
        }

        .tier-monster { background: #dc2626; }
        .tier-strong { background: #ea580c; }
        .tier-medium { background: #d97706; }
        .tier-weak { background: #6b7280; }
        .tier-draw { background: #2563eb; }
        .tier-air { background: #475569; }

        /* ===================== Board Texture Label ===================== */
        .board-texture {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 600;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
        }

        /* ===================== YouTube Button ===================== */
        .yt-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            background: #dc2626;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
            text-decoration: none;
        }

        .yt-btn:hover { background: #b91c1c; }

        .yt-btn svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        .replay-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            background: #2563eb;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
            text-decoration: none;
        }

        .replay-btn:hover { background: #1d4ed8; }

        .replay-btn svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        /* ===================== Skill Rating Circle ===================== */
        .skill-rating {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
        }

        .skill-rating-sm {
            width: 24px;
            height: 24px;
            font-size: 10px;
        }

        /* ===================== Style Badge ===================== */
        .style-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 14px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 700;
            background: var(--bg-card);
            border: 2px solid var(--border-medium);
        }

        /* ===================== Strength/Leak Tags ===================== */
        .tag-strength {
            display: inline-flex;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            background: #ecfdf5;
            color: #059669;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid #a7f3d0;
        }

        .tag-leak {
            display: inline-flex;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            background: #fef2f2;
            color: #dc2626;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid #fecaca;
        }

        /* ===================== Rivalry Section ===================== */
        .rivalry-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            margin-bottom: 8px;
            box-shadow: var(--shadow-card);
        }

        .rivalry-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
        }

        .rivalry-info { flex: 1; }

        .rivalry-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ===================== Search Screen ===================== */
        .search-screen { padding: 24px 16px; }

        .search-input-wrap {
            position: relative;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1.5px solid var(--border-medium);
            border-radius: var(--radius);
            height: 50px;
            padding: 0 16px 0 44px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.15s;
            box-shadow: var(--shadow-card);
        }

        .search-input:focus { border-color: var(--accent-orange); }
        .search-input::placeholder { color: var(--text-muted); }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: var(--text-muted);
        }

        .category-pills {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .category-pills::-webkit-scrollbar { display: none; }

        .cat-pill {
            padding: 8px 16px;
            border-radius: var(--radius-full);
            background: var(--bg-card);
            border: 1px solid var(--border-medium);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .cat-pill.active {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
            color: #fff;
        }

        .cat-pill:hover:not(.active) { border-color: var(--accent-orange); color: var(--accent-orange); }

        .suggestion-bubble {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 18px 18px 18px 4px;
            padding: 12px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 8px;
            color: var(--text-primary);
            box-shadow: var(--shadow-card);
        }

        .suggestion-bubble:hover { border-color: var(--accent-orange); background: #fff7ed; }

        /* ===================== Standing Row ===================== */
        .standing-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: background 0.1s;
        }

        .standing-row:hover { background: var(--bg-secondary); }

        .standing-rank {
            font-size: 14px;
            font-weight: 800;
            width: 24px;
            text-align: center;
            color: var(--text-muted);
        }

        .standing-rank.gold { color: #ca8a04; }
        .standing-rank.silver { color: #9ca3af; }
        .standing-rank.bronze { color: #b45309; }

        .standing-info { flex: 1; }

        .standing-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .standing-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        .standing-result {
            font-size: 14px;
            font-weight: 700;
        }

        /* ===================== Tab Strip ===================== */
        .tab-strip {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 0 16px 12px;
            scrollbar-width: none;
        }

        .tab-strip::-webkit-scrollbar { display: none; }

        .strip-tab {
            padding: 8px 16px;
            border-radius: var(--radius-full);
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .strip-tab.active {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
            color: #fff;
        }

        /* ===================== Scouting Card (Trading Card) ===================== */
        .scout-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: var(--shadow-elevated);
        }

        .scout-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-gold));
        }

        .scout-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .scout-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scout-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .scout-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-orange);
        }

        .scout-stat-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ===================== Stat Bubble ===================== */
        .stat-bubble {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            border: 2px solid;
            text-align: center;
            background: var(--bg-card);
        }

        .stat-bubble-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            text-align: center;
            margin-top: 4px;
        }

        /* ===================== Grade Ring (SVG) ===================== */
        .grade-ring-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grade-ring-value {
            position: absolute;
            font-size: 24px;
            font-weight: 800;
        }

        /* ===================== Leak Card ===================== */
        .leak-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
            position: relative;
        }

        .leak-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
        }

        .leak-card.severity-high::before { background: var(--accent-red); }
        .leak-card.severity-medium::before { background: var(--accent-amber); }
        .leak-card.severity-low::before { background: var(--accent-emerald); }

        .leak-severity-bar {
            padding: 6px 14px 6px 18px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .leak-severity-bar.high { background: #fef2f2; color: var(--accent-red); }
        .leak-severity-bar.medium { background: #fffbeb; color: var(--accent-amber); }
        .leak-severity-bar.low { background: #ecfdf5; color: var(--accent-emerald); }

        .leak-body { padding: 14px 14px 14px 18px; }

        .leak-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .leak-compare {
            display: flex;
            gap: 24px;
            margin: 10px 0;
        }

        .leak-val-group { display: flex; flex-direction: column; }

        .leak-val-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .leak-val {
            font-size: 20px;
            font-weight: 800;
        }

        .leak-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* ===================== AI Chat ===================== */
        .chat-user {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .chat-user-bubble {
            background: var(--accent-orange);
            color: #fff;
            padding: 10px 16px;
            border-radius: 18px 18px 4px 18px;
            font-size: 14px;
            font-weight: 500;
            max-width: 80%;
            box-shadow: 0 2px 8px rgba(234,88,12,0.2);
        }

        .chat-ai {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .chat-ai-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-orange), #f97316);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .chat-ai-bubble {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            padding: 14px 16px;
            border-radius: 18px 18px 18px 4px;
            font-size: 14px;
            line-height: 1.6;
            max-width: 85%;
            color: var(--text-primary);
            box-shadow: var(--shadow-card);
        }

        .chat-ai-bubble strong { color: var(--accent-orange); cursor: pointer; }

        /* Embed Cards in Chat */
        .embed-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            margin: 8px 0;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .embed-card:hover { border-color: var(--accent-orange); }

        .embed-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .embed-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .embed-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
        }

        /* Bluff Detection Card */
        .bluff-card {
            background: #fef2f2;
            border: 2px solid var(--accent-red);
            border-radius: var(--radius-sm);
            padding: 12px;
            margin: 10px 0;
        }

        .bluff-header {
            font-size: 13px;
            font-weight: 800;
            color: var(--accent-red);
            margin-bottom: 6px;
        }

        .bluff-detail {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        /* ===================== Pricing ===================== */
        .pricing-hero {
            text-align: center;
            padding: 32px 16px;
        }

        .pricing-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .plan-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 16px;
        }

        .plan-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-card);
        }

        .plan-card.featured {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 1px var(--accent-orange), var(--shadow-elevated);
            position: relative;
            overflow: hidden;
        }

        .plan-card.featured::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-gold));
        }

        .plan-icon { font-size: 28px; margin-bottom: 8px; }

        .plan-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .plan-price {
            font-size: 32px;
            font-weight: 800;
            margin: 4px 0 12px;
            color: var(--text-primary);
        }

        .plan-price span {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .plan-features {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .plan-features li {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .plan-features li::before {
            content: '\2713';
            color: var(--accent-orange);
            font-weight: 700;
            flex-shrink: 0;
        }

        /* ===================== Paywall ===================== */
        .paywall { position: relative; }

        .paywall-blur {
            filter: blur(5px);
            pointer-events: none;
            user-select: none;
        }

        .paywall-cta {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 0%, var(--bg-secondary) 50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 24px;
            gap: 10px;
        }

        .paywall-text {
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            color: var(--text-primary);
        }

        /* ===================== Checklist ===================== */
        .checklist {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 16px;
        }

        .checklist-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .check-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-light);
            font-size: 14px;
            color: var(--text-primary);
        }

        .check-item:last-child { border-bottom: none; }

        .check-box {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 2px solid var(--border-medium);
            flex-shrink: 0;
            margin-top: 1px;
        }

        .check-num {
            color: var(--accent-orange);
            font-weight: 700;
            min-width: 18px;
        }

        /* ===================== Buttons ===================== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 24px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-orange { background: var(--accent-orange); color: #fff; }
        .btn-orange:hover { background: #c2410c; }
        .btn-orange.full { width: 100%; }

        .btn-ghost {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-medium);
        }

        .btn-ghost:hover { border-color: var(--accent-orange); color: var(--accent-orange); }
        .btn-sm { padding: 8px 16px; font-size: 13px; }

        /* ===================== Utilities ===================== */
        .text-orange { color: var(--accent-orange); }
        .text-green { color: var(--accent-emerald); }
        .text-red { color: var(--accent-red); }
        .text-gold { color: var(--accent-gold); }
        .text-muted { color: var(--text-muted); }
        .fw-700 { font-weight: 700; }
        .fw-800 { font-weight: 800; }

        .mt-sm { margin-top: 8px; }
        .mt-md { margin-top: 16px; }
        .mt-lg { margin-top: 24px; }
        .mb-sm { margin-bottom: 8px; }
        .mb-md { margin-bottom: 16px; }

        .stack { display: flex; flex-direction: column; gap: 12px; }
        .row { display: flex; align-items: center; gap: 10px; }
        .wrap { flex-wrap: wrap; }

        /* ===================== Stagger Fade-In Animation ===================== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stagger > * {
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
        }

        .stagger > *:nth-child(1) { animation-delay: 0.0s; }
        .stagger > *:nth-child(2) { animation-delay: 0.05s; }
        .stagger > *:nth-child(3) { animation-delay: 0.06s; }
        .stagger > *:nth-child(4) { animation-delay: 0.09s; }
        .stagger > *:nth-child(5) { animation-delay: 0.12s; }
        .stagger > *:nth-child(6) { animation-delay: 0.15s; }
        .stagger > *:nth-child(7) { animation-delay: 0.18s; }
        .stagger > *:nth-child(8) { animation-delay: 0.21s; }
        .stagger > *:nth-child(9) { animation-delay: 0.24s; }
        .stagger > *:nth-child(10) { animation-delay: 0.27s; }
        .stagger > *:nth-child(11) { animation-delay: 0.30s; }
        .stagger > *:nth-child(12) { animation-delay: 0.33s; }

        @keyframes fillRing {
            from { stroke-dashoffset: 226; }
        }

        /* ===================== Hand Row (in tournament hands tab) ===================== */
        .hand-row {
            padding: 10px 0;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
        }

        .hand-row:hover { background: var(--bg-secondary); }

        .hand-row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hand-row-bottom {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        /* ===================== Career Record ===================== */
        .career-record {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .career-sep { color: var(--border-medium); }

        /* ===================== Luck Gauge SVG ===================== */
        @keyframes luckFill {
            from { stroke-dashoffset: 157; }
        }

        /* ===================== Tournaments List Page ===================== */
        .tournaments-page { padding: 0 16px; }

        .tournaments-back {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            padding: 12px 0 8px;
        }

        .tournaments-back:hover { color: var(--accent-orange); }

        .tournaments-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .tournaments-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .tournaments-search {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            background: var(--bg-card);
            font-size: 14px;
            color: var(--text-primary);
            font-family: inherit;
            outline: none;
        }

        .tournaments-search:focus { border-color: var(--accent-orange); box-shadow: 0 0 0 2px rgba(234,88,12,0.1); }

        .tournaments-search-wrap {
            position: relative;
            margin-bottom: 12px;
        }

        .tournaments-search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .filter-chips::-webkit-scrollbar { display: none; }

        .filter-chip {
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 700;
            border: 1px solid var(--border-light);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .filter-chip:hover { border-color: var(--accent-orange); color: var(--accent-orange); }

        .filter-chip.active {
            background: var(--accent-orange);
            color: #fff;
            border-color: var(--accent-orange);
        }

        .filter-chip .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-red);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .filter-chip.active .live-dot { background: #fff; }

        /* Scout-flavored tournament card */
        .tcard {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
            box-shadow: var(--shadow-card);
        }

        .tcard:hover { transform: scale(1.01); border-color: var(--accent-orange); box-shadow: var(--shadow-elevated); }

        .tcard-gradient { height: 4px; background: linear-gradient(90deg, var(--accent-orange), var(--accent-gold)); }
        .tcard-gradient.live { background: linear-gradient(90deg, var(--accent-red), #f87171); }
        .tcard-gradient.upcoming { background: linear-gradient(90deg, var(--accent-blue), #60a5fa); }

        .tcard-body { padding: 14px 16px; }

        .tcard-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .tcard-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .tcard-prize {
            font-size: 13px;
            font-weight: 800;
            color: var(--accent-emerald);
        }

        .tcard-venue {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        /* Player avatar row */
        .tcard-players {
            display: flex;
            align-items: center;
            gap: 0;
            margin-bottom: 10px;
        }

        .tcard-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 10px;
            color: #fff;
            border: 2px solid #fff;
            margin-left: -6px;
            flex-shrink: 0;
        }

        .tcard-avatar:first-child { margin-left: 0; }

        .tcard-avatar-more {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 9px;
            color: var(--text-muted);
            background: var(--bg-tertiary);
            border: 2px solid #fff;
            margin-left: -6px;
        }

        .tcard-winner {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: 10px;
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-gold);
        }

        /* Intelligence row */
        .tcard-intel {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .tcard-intel-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 3px 8px;
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 700;
        }

        .intel-exploit {
            background: #fef2f2;
            color: #dc2626;
        }

        .intel-leaks {
            background: #fff7ed;
            color: #ea580c;
        }

        .intel-rivalry {
            background: #eff6ff;
            color: #2563eb;
        }

        .intel-ai {
            background: #faf5ff;
            color: #7c3aed;
        }

        /* Bottom badges row */
        .tcard-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* Section divider in list */
        .tlist-section {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            padding: 16px 0 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tlist-section::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-light);
        }

        .tournament-list-count {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .tournaments-empty {
            text-align: center;
            padding: 48px 16px;
            color: var(--text-muted);
        }

        .tournaments-empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .tournaments-empty-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .tournaments-empty-sub {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* ===================== Player Cards ===================== */

        .pcard {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
            padding: 14px;
            cursor: pointer;
            transition: transform 0.18s, box-shadow 0.18s;
            margin-bottom: 10px;
        }

        .pcard:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-elevated);
        }

        .pcard:active {
            transform: scale(0.98);
        }

        .pcard-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .pcard-info {
            flex: 1;
            min-width: 0;
        }

        .pcard-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px;
        }

        .pcard-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pcard-meta {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .pcard-stats {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            padding: 8px 0;
            border-top: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
        }

        .pcard-stat {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-tertiary);
            border-radius: 6px;
            padding: 3px 7px;
            white-space: nowrap;
        }

        .pcard-stat b {
            color: var(--text-primary);
            font-weight: 700;
        }

        .pcard-intel {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .pcard-identity {
            font-size: 12px;
            font-style: italic;
            color: var(--text-secondary);
            line-height: 1.5;
            padding: 8px 0 4px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 4px;
        }

        .pcard-preview {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 11px;
            margin-top: 6px;
        }

        .pcard-preview-strength {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .pcard-preview-leak {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-left: 3px solid #dc2626;
        }

        .pcard-preview-icon {
            font-size: 12px;
            flex-shrink: 0;
        }

        .pcard-preview-title {
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pcard-preview-stat {
            font-size: 10px;
            color: #059669;
            font-weight: 600;
            flex-shrink: 0;
        }

        .pcard-preview-sev {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .pcard-cta {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-orange);
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--border-light);
        }

        /* ===================== Scout Report (Player Detail) ===================== */

        .sr-identity {
            font-style: italic;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            padding: 10px 14px;
            background: var(--bg-tertiary);

    // SVG Radar Chart for 6 player dimensions
    function radarChartSvg(dims, color, size) {
        size = size || 180;
        var cx = size / 2, cy = size / 2, r = size * 0.38;
        var labels = ['AGG', 'RISK', 'ICM', 'PREC', 'ADAPT', 'CLUTCH'];
        var values = [dims.aggression, dims.risk, dims.icm, dims.precision, dims.adaptability, dims.clutch];
        var n = 6;

        function polarXY(angle, radius) {
            var rad = (angle - 90) * Math.PI / 180;
            return { x: cx + radius * Math.cos(rad), y: cy + radius * Math.sin(rad) };
        }

        var svg = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">';

        // Grid rings (25%, 50%, 75%, 100%)
        [0.25, 0.5, 0.75, 1.0].forEach(function(pct) {
            var pts = [];
            for (var i = 0; i < n; i++) {
                var p = polarXY(i * 60, r * pct);
                pts.push(p.x.toFixed(1) + ',' + p.y.toFixed(1));
            }
            svg += '<polygon points="' + pts.join(' ') + '" fill="none" stroke="#d1d5db" stroke-width="' + (pct === 1 ? '1' : '0.5') + '" opacity="0.5"/>';
        });

        // Axis lines
        for (var i = 0; i < n; i++) {
            var p = polarXY(i * 60, r);
            svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) + '" stroke="#d1d5db" stroke-width="0.5" opacity="0.4"/>';
        }

        // Data polygon
        var dataPts = [];
        for (var i = 0; i < n; i++) {
            var p = polarXY(i * 60, r * values[i] / 100);
            dataPts.push(p.x.toFixed(1) + ',' + p.y.toFixed(1));
        }
        svg += '<polygon points="' + dataPts.join(' ') + '" fill="' + color + '" fill-opacity="0.15" stroke="' + color + '" stroke-width="2"/>';

        // Data points
        for (var i = 0; i < n; i++) {
            var p = polarXY(i * 60, r * values[i] / 100);
            svg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3" fill="' + color + '"/>';
        }

        // Labels
        var labelR = r + 16;
        for (var i = 0; i < n; i++) {
            var p = polarXY(i * 60, labelR);
            svg += '<text x="' + p.x.toFixed(1) + '" y="' + (p.y + 1).toFixed(1) + '" text-anchor="middle" dominant-baseline="middle" fill="#6b7280" font-size="10" font-weight="600">' + labels[i] + '</text>';
        }

        // Value labels (smaller, closer)
        var valR = r + 28;
        for (var i = 0; i < n; i++) {
            var p = polarXY(i * 60, valR);
            svg += '<text x="' + p.x.toFixed(1) + '" y="' + (p.y + 1).toFixed(1) + '" text-anchor="middle" dominant-baseline="middle" fill="' + color + '" font-size="9" font-weight="700">' + values[i] + '</text>';
        }

        svg += '</svg>';
        return svg;
    }

            '<text x="' + (size / 2) + '" y="' + (size * 0.52) + '" text-anchor="middle" font-size="' + (size * 0.22) + '" font-weight="800" fill="' + color + '">' + sign + score + '%</text>' +

    // ===================== Card SVG Helpers =====================

    function cardSvg(card) {
        if (!card || card.length < 2) return '<span class="card-mini black">?</span>';
        var rank = card[0], suit = card[1];
        var suitMap = { s:'\u2660', h:'\u2665', d:'\u2666', c:'\u2663' };
        var suitSymbol = suitMap[suit] || '?';
        var isRed = suit === 'h' || suit === 'd';
        var display = rank === 'T' ? '10' : rank;
        return '<span class="card-mini ' + (isRed ? 'red' : 'black') + '">' +
            '<span class="card-mini-rank">' + display + '</span>' +
            '<span class="card-mini-suit">' + suitSymbol + '</span></span>';
    }

    function boardCardsSvg(cards) {
        if (!cards || !cards.length) return '';
        return '<div class="board-cards">' + cards.map(cardSvg).join('') + '</div>';
    }

    function holeCardsSvg(cards) {
        if (!cards || !cards.length) return '';
        return '<div class="hole-cards">' + cards.map(cardSvg).join('') + '</div>';
    }

    // ===================== Sparkline SVG =====================

    function sparklineSvg(data, width, height, color) {
        width = width || 80; height = height || 24; color = color || 'var(--accent-orange)';
        if (!data || data.length < 2) return '';
        var max = Math.max.apply(null, data), min = Math.min.apply(null, data);
        var range = max - min || 1;
        var step = width / (data.length - 1);
        var pts = data.map(function(v, i) {
            return (i * step).toFixed(1) + ',' + (height - ((v - min) / range) * (height - 4) - 2).toFixed(1);
        });
        return '<svg width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + ' ' + height + '">' +
            '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
            '<circle cx="' + pts[pts.length-1].split(',')[0] + '" cy="' + pts[pts.length-1].split(',')[1] + '" r="2" fill="' + color + '"/></svg>';
    }

    // ===================== Threat Meter / Ring =====================

    function threatMeterSvg(score, width) {
        width = width || 54;
        var pct = Math.min(100, Math.max(0, score));
        var color = pct >= 70 ? '#ef4444' : pct >= 40 ? '#f59e0b' : '#10b981';
        var fillW = (pct / 100) * width;
        return '<svg width="' + width + '" height="6" viewBox="0 0 ' + width + ' 6">' +
            '<rect x="0" y="0" width="' + width + '" height="6" rx="3" fill="#e5e7eb"/>' +
            '<rect x="0" y="0" width="' + fillW + '" height="6" rx="3" fill="' + color + '"/></svg>';
    }

    function threatRingSvg(score, size) {
        size = size || 48;
        var r = (size / 2) - 2;
        var circ = 2 * Math.PI * r;
        var pct = Math.min(100, Math.max(0, score)) / 100;
        var offset = circ - (circ * pct);
        var color = score >= 70 ? '#ef4444' : score >= 40 ? '#f59e0b' : '#10b981';
        return '<svg width="' + (size+4) + '" height="' + (size+4) + '" viewBox="0 0 ' + (size+4) + ' ' + (size+4) + '">' +
            '<circle cx="' + (size/2+2) + '" cy="' + (size/2+2) + '" r="' + r + '" fill="none" stroke="#e5e7eb" stroke-width="3"/>' +
            '<circle cx="' + (size/2+2) + '" cy="' + (size/2+2) + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="3" stroke-linecap="round" ' +
            'stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '" style="transform:rotate(-90deg);transform-origin:center"/></svg>';
    }

    // ===================== Chip Stack Chart SVG =====================

    function stackChartSvg(playerIds, width, height) {
        width = width || 358; height = height || 180;
        var pad = { top:10, right:10, bottom:24, left:10 };
        var cW = width - pad.left - pad.right, cH = height - pad.top - pad.bottom;
        var maxLen = 0, maxVal = 0;
        playerIds.forEach(function(pid) {
            var d = STACK_TIMELINE[pid] || [];
            if (d.length > maxLen) maxLen = d.length;
            d.forEach(function(v) { if (v > maxVal) maxVal = v; });
        });
        if (maxLen < 2 || maxVal === 0) return '';
        var svg = '<svg width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + ' ' + height + '">';
        // Grid lines
        for (var g = 0; g <= 4; g++) {
            var gy = pad.top + (cH / 4) * g;
            svg += '<line x1="' + pad.left + '" y1="' + gy + '" x2="' + (width-pad.right) + '" y2="' + gy + '" stroke="#e5e7eb" stroke-width="0.5"/>';
        }
        // Y-axis labels
        for (var y = 0; y <= 4; y++) {
            var yy = pad.top + (cH / 4) * y;
            var yVal = maxVal - (maxVal / 4) * y;
            svg += '<text x="' + pad.left + '" y="' + (yy - 3) + '" font-size="8" fill="#94a3b8">' + fmtChips(Math.round(yVal)) + '</text>';
        }
        // Player lines
        playerIds.forEach(function(pid) {
            var data = STACK_TIMELINE[pid] || [];
            var p = PLAYERS.find(function(x) { return x.id === pid; });
            var color = p ? p.color : '#666';
            var pts = [];
            data.forEach(function(v, i) {
                var x = pad.left + (i / (maxLen - 1)) * cW;
                var yp = pad.top + cH - (v / maxVal) * cH;
                pts.push(x.toFixed(1) + ',' + yp.toFixed(1));
            });
            svg += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>';
            // X mark if eliminated
            if (data[data.length-1] === 0 && data.length >= 2) {
                var lx = pad.left + ((data.length-1) / (maxLen-1)) * cW;
                svg += '<text x="' + lx + '" y="' + (pad.top + cH + 2) + '" text-anchor="middle" fill="' + color + '" font-size="10" font-weight="800">\u2716</text>';
            }
            // End dot for winner
            if (data[data.length-1] > 0) {
                var ex = pad.left + ((data.length-1) / (maxLen-1)) * cW;
                var ey = pad.top + cH - (data[data.length-1] / maxVal) * cH;
                svg += '<circle cx="' + ex + '" cy="' + ey + '" r="3" fill="' + color + '"/>';
            }
        });
        // Hand labels along bottom
        var handLabels = [1, Math.round(87*0.25), Math.round(87*0.5), Math.round(87*0.75), 87];
        handLabels.forEach(function(h) {
            var hx = pad.left + ((h-1) / (maxLen-1)) * cW;
            svg += '<text x="' + hx + '" y="' + (height - 4) + '" text-anchor="middle" font-size="8" fill="#94a3b8">H' + h + '</text>';
        });
        svg += '</svg>';
        return svg;
    }

    // ===================== Quiz Card Renderer =====================

    function renderQuizCard(quiz, full) {
        var answered = quizState.answered[quiz.id];
        var isAnswered = answered !== undefined;
        var html = '<div class="quiz-card">';
        html += '<div class="quiz-header"><span class="quiz-header-title">\u{1F9E0} What Would You Do?</span>';
        if (quizState.streak > 0) html += '<span class="quiz-streak">\u{1F525} ' + quizState.streak + '</span>';
        html += '</div>';
        html += '<div class="quiz-body">';
        html += '<div class="quiz-situation"><strong>' + quiz.situation + '</strong> ' + quiz.facing + '</div>';
        if (quiz.board && quiz.board.length) {
            html += '<div style="text-align:center;margin:8px 0"><span style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase">' + quiz.street + '</span></div>';
            html += '<div style="display:flex;justify-content:center;margin-bottom:8px">' + boardCardsSvg(quiz.board) + '</div>';
        }
        html += '<div style="text-align:center;margin-bottom:4px"><span style="font-size:11px;font-weight:600;color:var(--text-muted)">Your Hand</span></div>';
        html += holeCardsSvg(quiz.holeCards);
        if (quiz.action) html += '<div style="text-align:center;font-size:13px;color:var(--text-secondary);margin:8px 0">' + quiz.action + '</div>';
        html += '<div class="quiz-actions">';
        quiz.options.forEach(function(opt, i) {
            var cls = 'quiz-btn';
            if (isAnswered) {
                if (i === quiz.correct) cls += ' correct';
                else if (i === answered && i !== quiz.correct) cls += ' wrong';
            }
            html += '<button class="' + cls + '" onclick="event.stopPropagation();answerQuiz(\'' + quiz.id + '\',' + i + ')">' + opt + '</button>';
        });
        html += '</div></div>';
        if (isAnswered) {
            var wasCorrect = answered === quiz.correct;
            html += '<div class="quiz-reveal">';
            html += '<div class="quiz-reveal-title">' + (wasCorrect ? '\u2705 Correct!' : '\u274C Not quite') + '</div>';
            html += '<div style="font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:4px">' + quiz.proName + ' chose: ' + quiz.proAction + '</div>';
            html += '<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">' + quiz.proPercent + '% of pros agreed</div>';
            html += '<div class="equity-bar"><div class="equity-fill" style="width:' + quiz.equity + '%;background:' + (quiz.equity > 50 ? 'var(--accent-emerald)' : 'var(--accent-amber)') + '"></div></div>';
            html += '<div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">Hero equity: ' + quiz.equity + '%</div>';
            html += '<div class="quiz-reveal-text">' + quiz.explanation + '</div>';
            html += '</div>';
        }
        html += '</div>';
        return html;
    }

    function answerQuiz(quizId, choice) {
        if (quizState.answered[quizId] !== undefined) return;
        var quiz = QUIZ_HANDS.find(function(q) { return q.id === quizId; });
        if (!quiz) return;
        quizState.answered[quizId] = choice;
        quizState.total++;
        if (choice === quiz.correct) { quizState.correct++; quizState.streak++; }
        else { quizState.streak = 0; }
        render();
    }

    // ===================== Router =====================

    var currentRoute = { path: 'intel', params: {} };

    function parseHash() {
        var raw = (window.location.hash || '#/intel').slice(2);
        var parts = raw.split('?');
        var path = parts[0] || 'intel';
        var params = {};
        if (parts[1]) {
            parts[1].split('&').forEach(function(p) {
                var kv = p.split('=');
                params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
            });
        }
        return { path: path, params: params };

            html += renderQuizCard(QUIZ_HANDS[i], true);
        }
        html += '</div></div>';

        html += '</div>';
        return html;
    }

    // ===================== Story Screen (Tournament Narrative) =====================

    function renderStory() {
        var html = '<div class="stagger">';

        // Header
        html += '<div class="content">' +
            '<div style="font-size:22px;font-weight:800;color:var(--text-primary)">\u{1F4D6} The Story</div>' +
            '<div style="font-size:13px;color:var(--text-secondary);margin-top:4px">' + TOURNAMENT.name + ' \u2014 A tale in ' + TOURNAMENT.handCount + ' hands</div>' +
        '</div>';

        // === 1. CHIP STACK CHART ===
        html += '<div class="content">' +
            '<div class="stack-chart">' +
                stackChartSvg(['p1','p2','p3','p4','p5'], 358, 180) +
                '<div class="stack-legend">';

        ['p1','p2','p3','p4','p5'].forEach(function(pid) {
            var p = PLAYERS.find(function(pl) { return pl.id === pid; });
            if (p) {
                html += '<div class="stack-legend-item">' +
                    '<div class="stack-legend-dot" style="background:' + p.color + '"></div>' +
                    '<span>' + p.name.split(' ').pop() + '</span>' +
                '</div>';
            }
        });
        html += '</div></div></div>';

        // === 2. STORY CHAPTERS ===
        html += '<div class="section">' +
            '<div class="section-header">' +
                '<div class="section-title">\u{1F4DA} Chapters</div>' +
            '</div>' +
            '<div class="content stagger">';

        STORY_ARC.chapters.forEach(function(ch) {
            html += '<div class="chapter-card">' +
                '<div class="chapter-mood ' + ch.mood + '"></div>' +
                '<div class="chapter-body">' +
                    '<div class="chapter-title">' + ch.title + '</div>' +
                    '<div class="chapter-range">' + ch.handRange + '</div>' +
                    '<div class="chapter-summary">' + ch.summary + '</div>' +
                    '<div class="chapter-key-hand">' +
                        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">' +
                            '<span style="font-size:12px;font-weight:700;color:var(--accent-orange)">KEY HAND #' + ch.keyHand.hand + '</span>' +
                            replayBtn(ch.keyHand.hand) +
                        '</div>' +
                        '<div style="margin-bottom:6px">' + boardCardsSvg(ch.keyHand.board) + '</div>' +
                        '<div style="font-size:12px;color:var(--text-secondary)">' + ch.keyHand.desc + '</div>' +
                    '</div>' +
                '</div>' +
            '</div>';
        });
        html += '</div></div>';

        // === 3. ELIMINATION TIMELINE ===
        html += '<div class="section">' +
            '<div class="section-header">' +
                '<div class="section-title">\u{1F480} Elimination Timeline</div>' +
            '</div>' +
            '<div class="content">' +
            '<div class="elim-timeline">' +
                '<div class="elim-line"></div>';

        STORY_ARC.eliminations.forEach(function(e) {
            var eliminated = PLAYERS.find(function(p) { return p.id === e.playerId; });
            var elimBy = PLAYERS.find(function(p) { return p.id === e.eliminatedBy; });
            var place = eliminated ? eliminated.finish : '?';
            html += '<div class="elim-item">' +
                '<div class="elim-dot" style="background:' + (eliminated ? eliminated.color : '#94a3b8') + '"></div>' +
                '<div class="elim-info">' +
                    '<div class="elim-hand">Hand #' + e.hand + '</div>' +
                    '<div class="elim-desc">' +
                        '<strong>' + (eliminated ? eliminated.name.split(' ').pop() : '?') + '</strong> (' + place + ordSuffix(place) + ')' +
                        (elimBy ? ' \u2014 by ' + elimBy.name.split(' ').pop() : '') +
                    '</div>' +
                    '<div style="font-size:11px;color:var(--text-muted)">' + e.desc + '</div>' +
                '</div>' +
            '</div>';
        });
        html += '</div></div></div>';

        // === 4. GAMBIT THEMES ===
        html += '<div class="section">' +
            '<div class="section-header">' +
                '<div class="section-title">\u265F\uFE0F Strategic Gambits</div>' +
            '</div>' +
            '<div class="content stagger">';

        GAMBIT_THEMES.forEach(function(g) {
            html += '<div class="gambit-card" onclick="go(\'ai\',{q:\'Tell me about the ' + g.name + ' in hand #' + g.hand + '\'})">' +
                '<div class="gambit-icon" style="background:' + g.color + '20;color:' + g.color + '">' + g.icon + '</div>' +
                '<div style="flex:1;min-width:0">' +
                    '<div class="gambit-name">' + g.name + '</div>' +
                    '<div class="gambit-desc">' + g.desc + '</div>' +
                    '<div class="gambit-hand">Hand #' + g.hand + ' \u2192</div>' +
                '</div>' +
            '</div>';
        });
        html += '</div></div>';

        // === 5. BLUFF REPORT ===
        html += '<div class="section">' +
            '<div class="section-header">' +
                '<div class="section-title">\u{1F3AD} Bluff Report</div>' +
                '<span style="font-size:12px;color:var(--text-muted)">' + BLUFF_REPORT.length + ' detected</span>' +
            '</div>' +
            '<div class="content stagger">';

        BLUFF_REPORT.forEach(function(b) {
            var bluffer = PLAYERS.find(function(p) { return p.id === b.bluffer; });
            html += '<div class="bluff-item">' +
                '<div class="bluff-item-header">' +
                    '<div class="bluff-item-title">' +
                        (bluffer ? bluffer.name.split(' ').pop() : '?') + ' \u2014 ' + b.street + ' Bluff' +
                    '</div>' +
                    '<div class="bluff-result ' + (b.success ? 'success' : 'caught') + '">' +
                        (b.success ? '\u2713 Success' : '\u2717 Caught') +
                    '</div>' +
                '</div>' +
                '<div style="margin:8px 0">' + boardCardsSvg(b.board) + '</div>' +
                '<div class="bluff-item-meta">' +
                    '<span>Holding: ' + b.holding + '</span>' +
                    '<span>Sizing: ' + b.sizing + '</span>' +
                    '<span>Hand #' + b.hand + '</span>' +
                '</div>' +
            '</div>';
        });
        html += '</div></div>';

        html += '</div>';
        return html;
    }

    function ordSuffix(n) {
        if (n === 1) return 'st';
        if (n === 2) return 'nd';
        if (n === 3) return 'rd';
        return 'th';
    }

    // ===================== You Screen (Profile + Saved + Subscription) =====================

        var html = '<div class="stagger">';

        // Poker IQ Score ring
        var accuracy = quizState.total > 0 ? Math.round(quizState.correct / quizState.total * 100) : 0;
        var iqColor = accuracy >= 70 ? 'var(--accent-emerald)' : accuracy >= 40 ? 'var(--accent-amber)' : 'var(--accent-red)';

        html += '<div class="content" style="text-align:center;padding-top:12px">' +
            '<div class="iq-ring">' +
                '<svg width="120" height="120" viewBox="0 0 120 120">' +
                    '<circle cx="60" cy="60" r="52" fill="none" stroke="var(--border-light)" stroke-width="8"/>' +
                    '<circle cx="60" cy="60" r="52" fill="none" stroke="' + iqColor + '" stroke-width="8" ' +
                        'stroke-dasharray="' + (accuracy * 3.267) + ' 326.7" stroke-dashoffset="0" ' +
                        'transform="rotate(-90 60 60)" stroke-linecap="round"/>' +
                '</svg>' +
                '<div class="iq-ring-value" style="color:' + iqColor + '">' + accuracy + '</div>' +
                '<div class="iq-ring-label">Poker IQ</div>' +
            '</div>' +
            '<div style="display:flex;justify-content:center;gap:24px;margin-top:16px">' +
                '<div style="text-align:center">' +
                    '<div style="font-size:20px;font-weight:800">' + quizState.correct + '/' + quizState.total + '</div>' +
                    '<div style="font-size:11px;color:var(--text-muted)">Correct</div>' +
                '</div>' +
                '<div style="text-align:center">' +
                    '<div style="font-size:20px;font-weight:800">' + (quizState.streak > 0 ? '\u{1F525} ' + quizState.streak : '0') + '</div>' +
                    '<div style="font-size:11px;color:var(--text-muted)">Streak</div>' +
                '</div>' +
            '</div>' +
        '</div>';

        // Quick links
        html += '<div class="content stagger" style="margin-top:8px">' +
            '<div style="display:flex;gap:10px">' +
                '<div style="flex:1;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:16px;text-align:center;cursor:pointer" onclick="go(\'favorites\')">' +
                    '<div style="font-size:24px;margin-bottom:4px">\u2B50</div>' +
                    '<div style="font-size:13px;font-weight:600">Saved</div>' +
                '</div>' +
                '<div style="flex:1;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:16px;text-align:center;cursor:pointer" onclick="go(\'play\')">' +
                    '<div style="font-size:24px;margin-bottom:4px">\u{1F9E0}</div>' +
                    '<div style="font-size:13px;font-weight:600">Quiz</div>' +
                '</div>' +
                '<div style="flex:1;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:16px;text-align:center;cursor:pointer" onclick="go(\'tournaments\')">' +
                    '<div style="font-size:24px;margin-bottom:4px">\u{1F3C6}</div>' +
                    '<div style="font-size:13px;font-weight:600">History</div>' +
                '</div>' +
            '</div>' +
        '</div>';

        // Subscription card
        html += '<div class="content" style="margin-top:8px">' +
            '<div style="background:linear-gradient(135deg,#1e293b 0%,#334155 100%);border-radius:var(--radius);padding:20px;color:white">' +
                '<div style="display:flex;justify-content:space-between;align-items:center">' +
                    '<div>' +
                        '<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.6)">Current Plan</div>' +
                        '<div style="font-size:18px;font-weight:800;margin-top:4px">Rookie</div>' +
                        '<div style="font-size:12px;color:rgba(255,255,255,0.7);margin-top:4px">3 AI queries/day \u00B7 Basic stats</div>' +
                    '</div>' +
                    '<button class="btn btn-orange" onclick="go(\'pricing\')" style="white-space:nowrap">Upgrade \u2192</button>' +
                '</div>' +
            '</div>' +
        '</div>';

        // About section
        html += '<div class="content" style="margin-top:8px;text-align:center;padding-bottom:24px">' +
            '<div style="font-size:12px;color:var(--text-muted)">HUDR v2.0 \u00B7 AI Poker Intelligence</div>' +
            '<div style="font-size:11px;color:var(--text-muted);margin-top:4px">Built with \u2764\uFE0F for the poker community</div>' +
        '</div>';

        html += '</div>';
        return html;
    }

    // ===================== Category Switcher =====================

    function switchCat(cat, el) {
        // Update pills
        var pills = document.querySelectorAll('#catPills .cat-pill');
        pills.forEach(function(p) { p.classList.remove('active'); });
        el.classList.add('active');

        // Show/hide suggestion groups
        ['Tournament', 'Player', 'Hand', 'Strategy'].forEach(function(c) {
            var el = document.getElementById('sug_' + c);
            if (el) el.style.display = (c === cat) ? '' : 'none';
        });
    }

    // ===================== Hand Replayer Placeholder =====================

    function renderHandPlaceholder() {
        var handId = currentRoute.params.id || '?';
        var html = '<div class="content" style="text-align:center;padding-top:60px">';
        html += '<div style="font-size:56px;margin-bottom:16px">\u{1F0CF}</div>';
        html += '<div style="font-size:24px;font-weight:800;margin-bottom:8px">Hand #' + handId + '</div>';
        html += '<div style="font-size:14px;color:var(--text-muted);margin-bottom:8px">Hand Replayer</div>';
        html += '<div style="font-size:13px;color:var(--text-muted);margin-bottom:32px">Step-by-step replay with actions, bets, and board progression</div>';
        html += '<div style="display:inline-flex;gap:10px">';
        html += '<button class="btn btn-orange" onclick="history.back()">\u2190 Go Back</button>';
        html += ytBtn(2100);
        html += '</div>';
        html += '</div>';
        return html;
    }

    // ===================== Initial Render =====================
    window.addEventListener('DOMContentLoaded', render);
    </script>
